name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Validate packaged model
        run: python -c "from app.classifier import predict; print(predict('Laptop will not connect to office Wi-Fi'))"
      - name: Build container image
        run: docker build --tag helpdesk-ai:ci .
