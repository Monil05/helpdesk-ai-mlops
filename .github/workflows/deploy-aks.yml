name: Deploy to AKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing GHCR image tag
        required: true
        default: latest

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-demo
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-kubelogin@v1
        with:
          version: v0.2.10
      - name: Configure Azure CLI authentication for kubectl
        run: kubelogin convert-kubeconfig -l azurecli
      - name: Select image reference
        id: image
        env:
          TAG: ${{ inputs.image_tag }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$TAG" >> "$GITHUB_OUTPUT"
      - name: Deploy
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          kubectl apply -f k8s/prometheus.yaml
          kubectl apply -f k8s/grafana.yaml
          kubectl apply -f k8s/app.yaml
          kubectl -n helpdesk set image deployment/helpdesk-app app="$IMAGE"
          kubectl -n helpdesk rollout status deployment/helpdesk-app --timeout=180s
